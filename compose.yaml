services:
  app:
    build: .
    restart: unless-stopped
    environment:
      FACTORLAB_PUBLIC: '1'
      FACTORLAB_USERS_JSON: '${FACTORLAB_USERS_JSON:?Configure hashes de usuários}'
      FACTORLAB_DATA_DIR: /app/.cache
      FACTORLAB_SESSION_SECONDS: '1800'
      FACTORLAB_QUOTA_MB: '250'
    volumes:
      - factorlab-data:/app/.cache
    expose:
      - '8501'
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 2g
    cpus: 2
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    expose:
      - '8080'
    depends_on:
      - app
  https:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      FACTORLAB_DOMAIN: '${FACTORLAB_DOMAIN:?Configure domínio público}'
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - gateway
volumes:
  factorlab-data:
  caddy-data:
  caddy-config:
