[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "factorlab"
version = "0.2.0"
description = "Regressões CAPM e Fama–French com dados mensais e inferência HAC"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<2.4", "pandas>=2.2,<3", "statsmodels>=0.14.4,<0.15",
  "requests>=2.32,<3", "yfinance>=0.2.54,<1", "streamlit>=1.50,<2", "plotly>=6,<7", "pandas-market-calendars>=5,<6", "reportlab>=4.2,<5", "scipy>=1.14,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "playwright>=1.50,<2", "pytest-cov>=6,<8"]

[project.scripts]
factorlab = "factorlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live and not browser'"
filterwarnings = ["error"]
markers = [
  "live: integração com fontes externas (requer internet)",
  "browser: teste no Chromium contra dashboard local"
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.ruff]
line-length = 100
